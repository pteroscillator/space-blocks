<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="An arcade game: steer a small ship up through falling blocks, collect fruit and shields, with its own generated music.">
    <title>Space Blocks</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        :root {
            --bg: #000;
            --border-hover: #999;
            --text: #fff;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            --edge: 40px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        button, input, select, a {
            font-family: inherit;
        }

        button:focus-visible, a:focus-visible {
            outline: 1px solid var(--text) !important;
            outline-offset: 2px;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            touch-action: none;
        }

        .container {
            display: flex;
            height: 100vh;
            height: 100dvh;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .canvas-wrapper {
            position: relative;
            aspect-ratio: 9 / 16;
            max-height: 100%;
            max-width: 100%;
        }

        #canvas {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0a0a0a;
            display: block;
            width: 100%;
            height: 100%;
        }

        .touch-controls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(120px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            z-index: 60;
            flex-direction: row;
            background: transparent;
            border-top: none;
        }

        .touch-zone-steer {
            flex: 1;
            display: flex;
            flex-direction: row;
        }

        .touch-btn {
            position: relative;
            flex: 1;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            opacity: 0.7;
            pointer-events: auto;
        }

        .touch-btn:active, .touch-btn.active {
            opacity: 0.9;
        }
        .touch-btn.no-anim:active, .touch-btn.no-anim.active {
            opacity: 1;
        }

        .touch-btn-thrust {
            flex: 1;
        }

        .touch-btn-label {
            position: absolute;
            top: 12px;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            animation: touch-label-color 0.8s linear infinite;
        }
        .touch-btn.no-anim .touch-btn-label {
            display: none;
        }

        .touch-btn-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: touch-btn-color 0.8s linear infinite;
        }

        .touch-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .touch-btn-thrust .touch-btn-icon {
            width: 56px;
            height: 56px;
        }

        .touch-btn-thrust svg {
            width: 28px;
            height: 28px;
        }

        @keyframes touch-btn-color {
            0%   { border-color: #ff69b4; }
            33%  { border-color: #8b0000; }
            66%  { border-color: #ffffff; }
            100% { border-color: #ff69b4; }
        }
        @keyframes touch-btn-stroke {
            0%   { stroke: #ff69b4; }
            33%  { stroke: #8b0000; }
            66%  { stroke: #ffffff; }
            100% { stroke: #ff69b4; }
        }
        @keyframes touch-label-color {
            0%   { color: #ff69b4; }
            33%  { color: #8b0000; }
            66%  { color: #ffffff; }
            100% { color: #ff69b4; }
        }
        .touch-btn {
            animation: none;
        }
        .touch-btn svg {
            animation: touch-btn-stroke 0.8s linear infinite;
        }
        .touch-btn.no-anim {
            animation: none;
            border-color: transparent;
            background: transparent;
            opacity: 1;
        }
        .touch-btn.no-anim .touch-btn-icon {
            animation: none;
            border-color: rgba(255, 255, 255, 0.15);
            opacity: 0.5;
            transition: opacity 0.1s;
        }
        .touch-btn.no-anim.active .touch-btn-icon {
            opacity: 0.8;
        }
        .touch-btn.no-anim svg {
            animation: none;
            stroke: rgba(255, 255, 255, 0.5);
        }



        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .canvas-container {
                flex: 1;
                min-height: 0;
                padding: 0;
                padding-top: env(safe-area-inset-top, 0px);
            }

            .canvas-wrapper {
                width: 100%;
                height: 100%;
                aspect-ratio: auto;
            }

            #canvas {
                border: none;
            }

            .touch-controls {
                display: flex;
            }

        }


        /* Menu icon: standard pteroscillator icon, 28px with a 44px hit area */
        .desktop-nav-toggle {
            position: fixed;
            top: calc(var(--edge) + env(safe-area-inset-top, 0px));
            right: calc(var(--edge) + env(safe-area-inset-right, 0px));
            z-index: 5;
            display: block;
            background: none;
            border: none;
            padding: 8px;
            margin: -8px;
            color: var(--border-hover);
            cursor: pointer;
            line-height: 0;
            transition: color 0.3s;
        }

        .desktop-nav-toggle:hover {
            color: var(--text);
        }

        .desktop-nav-toggle svg {
            display: block;
        }

        .desktop-nav-toggle.hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .desktop-nav-toggle {
                display: none;
            }
        }


        /* --- Pre-splash (mobile audio unlock) --- */
        .pre-splash {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.75);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .pre-splash.active {
            display: flex;
        }
        .pre-splash-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.75);
            padding: 0 0 36px 0;
            background: #000;
            width: 70%;
            overflow: hidden;
        }
        .pre-splash-box .modal-logo-wrap {
            position: relative;
            width: 100%;
        }
        .pre-splash-hint {
            font-size: clamp(9px, 1.8vw, 12px);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-align: center;
            animation: modal-color-cycle 0.8s ease-in-out infinite;
        }
        @media (max-width: 768px) {
            .pre-splash {
                /* full screen - no touch controls visible */
            }
            .pre-splash-box {
                gap: 4px;
                padding-bottom: 8px;
            }
        }

        /* --- Splash modal --- */
        .modal-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 8%;
            background: rgba(0, 0, 0, 0.75);
            cursor: pointer;
            user-select: none;
            transition: opacity 0.4s ease;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.75);
            padding: 0 0 36px 0;
            background: #000;
            cursor: pointer;
            width: 70%;
            max-height: 70vh;
            overflow: hidden;
        }
        .modal-logo-wrap {
            position: relative;
            width: 100%;
        }
        .modal-logo-img {
            width: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .modal-logo-border {
            position: relative;
        }
        .modal-title-group {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            isolation: isolate;
            mix-blend-mode: screen;
        }
        .modal-title-tint {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            mix-blend-mode: multiply;
        }
        @keyframes modal-color-cycle {
            0%   { color: #ff69b4; }
            50%  { color: #8b0000; }
            100% { color: #ff69b4; }
        }
        .modal-color-cycle {
            animation: modal-color-cycle 0.8s ease-in-out infinite;
        }
        .modal-start-hint {
            font-size: clamp(9px, 1.8vw, 12px);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-align: center;
        }
        .modal-qr {
            display: block;
            width: 160px;
            height: 160px;
        }
        .modal-controls {
            font-size: clamp(9px, 1.8vw, 12px);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #fff;
            text-align: center;
            line-height: 1.8;
        }
        .modal-controls kbd {
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 2px 8px;
            margin: 0 2px;
            font-family: inherit;
            font-size: inherit;
            line-height: 1.4;
            min-width: 1.5em;
            text-align: center;
        }
        .modal-buttons {
            display: flex;
            flex-direction: row;
            gap: 12px;
            align-items: stretch;
        }
        .modal-music-toggle,
        .modal-exit {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(9px, 1.8vw, 12px);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #fff;
            background: none;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.7);
            padding: 6px 20px;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.3s, border-color 0.3s;
        }
        .modal-music-toggle:hover,
        .modal-exit:hover {
            border-color: #fff;
        }
        .modal-music-toggle .music-status {
            color: #0f0;
        }
        .modal-music-toggle.off .music-status {
            color: #f44;
        }
        @media (max-width: 768px) {
            .modal-overlay {
                bottom: calc(120px + env(safe-area-inset-bottom, 0px));
                align-items: center;
                padding-top: 0;
            }
            .modal-box {
                gap: 4px;
                padding-bottom: 8px;
                max-height: 90vh;
            }
            .modal-controls {
                display: none;
            }
            .modal-start-hint {
                margin: 0;
            }
            .modal-exit {
                padding: 4px 16px;
            }
        }

        /* Reduced motion: stop the colour cycling */
        @media (prefers-reduced-motion: reduce) {
            .modal-color-cycle,
            .pre-splash-hint,
            .touch-btn-label,
            .touch-btn-icon,
            .touch-btn svg {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
                <div class="pre-splash" id="pre-splash">
                    <div class="pre-splash-box">
                        <div class="modal-logo-wrap">
                            <img src="space-blocks-border.svg" class="modal-logo-img modal-logo-border" alt="">
                            <div class="modal-title-group">
                                <img src="space-blocks-title.svg" class="modal-logo-img" alt="Space Blocks">
                                <div class="modal-title-tint"></div>
                            </div>
                        </div>
                        <div class="pre-splash-hint modal-color-cycle">Tap anywhere to start</div>
                    </div>
                </div>
                <div class="modal-overlay" id="modal-overlay">
                    <div class="modal-box">
                        <div class="modal-logo-wrap">
                            <img src="space-blocks-border.svg" class="modal-logo-img modal-logo-border" alt="">
                            <div class="modal-title-group">
                                <img src="space-blocks-title.svg" class="modal-logo-img" alt="Space Blocks">
                                <div class="modal-title-tint"></div>
                            </div>
                        </div>
